version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: aerotwin_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: aerotwin
      POSTGRES_PASSWORD: aerotwin
      POSTGRES_DB: aerotwin
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerotwin -d aerotwin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
    driver: local
